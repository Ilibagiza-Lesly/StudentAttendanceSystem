<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendEase | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #103d30, #176b4d);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            background: #e5f4ec;
            color: #176b4d;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo h1 {
            color: #176b4d;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 13px;
        }

        .login-card h2 {
            color: #222;
            font-size: 21px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        input {
            width: 100%;
            padding: 13px 42px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #176b4d;
            box-shadow: 0 0 0 3px rgba(23,107,77,.1);
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            color: #777;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #176b4d;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #10543c;
        }

        .login-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .message.error {
            display: block;
            background: #ffe9e9;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #e5f4ec;
            color: #176b4d;
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        .switch-btn {
            border: none;
            background: none;
            color: #176b4d;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .switch-btn:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <h1>AttendEase</h1>
            <p>Student Attendance Management System</p>
        </div>

        <div id="message" class="message" role="alert"></div>

        <!-- LOGIN FORM -->

        <div id="loginSection">

            <h2>Sign In</h2>
            <p class="subtitle">Sign in to access your dashboard.</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>

            </form>

            <p class="switch-text">
                Are you a lecturer?
                <button type="button" class="switch-btn" id="showRegister">
                    Create Account
                </button>
            </p>

        </div>

        <!-- LECTURER REGISTRATION FORM -->

        <div id="registerSection" style="display:none;">

            <h2>Create Lecturer Account</h2>
            <p class="subtitle">Register to access the attendance dashboard.</p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="registerFullName">Full Name</label>

                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="registerFullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerUsername">Username</label>

                    <div class="input-wrapper">
                        <i class="fas fa-user-circle"></i>

                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>

                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="At least 6 characters"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="login-btn" id="registerButton">
                    Create Account <i class="fas fa-arrow-right"></i>
                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <button type="button" class="switch-btn" id="showLogin">
                    Sign In
                </button>
            </p>

        </div>

        <div class="footer">
            AttendEase &copy; 2026. All rights reserved.
        </div>

    </div>

    <script>

        // ==========================================
        // ELEMENTS
        // ==========================================

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        const loginSection = document.getElementById("loginSection");
        const registerSection = document.getElementById("registerSection");

        const message = document.getElementById("message");

        const loginButton = document.getElementById("loginButton");
        const registerButton = document.getElementById("registerButton");


        // ==========================================
        // SHOW LOGIN / REGISTRATION
        // ==========================================

        document.getElementById("showRegister").addEventListener("click", () => {

            loginSection.style.display = "none";
            registerSection.style.display = "block";

            message.className = "message";
            message.textContent = "";

        });

        document.getElementById("showLogin").addEventListener("click", () => {

            registerSection.style.display = "none";
            loginSection.style.display = "block";

            message.className = "message";
            message.textContent = "";

        });


        // ==========================================
        // SHOW / HIDE LOGIN PASSWORD
        // ==========================================

        document.getElementById("togglePassword").addEventListener("click", () => {

            const password = document.getElementById("password");
            const icon = document.querySelector("#togglePassword i");

            password.type =
                password.type === "password" ? "text" : "password";

            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");

        });


        // ==========================================
        // LOGIN
        // ==========================================

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            message.className = "message";
            message.textContent = "";

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {

                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed.");
                }

                message.textContent = "Login successful. Opening dashboard...";
                message.className = "message success";

                window.location.replace("/dashboard");

            } catch (error) {

                message.textContent = error.message;
                message.className = "message error";

                loginButton.disabled = false;
                loginButton.innerHTML =
                    'Sign In <i class="fas fa-arrow-right"></i>';

            }

        });


        // ==========================================
        // LECTURER REGISTRATION
        // ==========================================

        registerForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const fullName =
                document.getElementById("registerFullName").value.trim();

            const username =
                document.getElementById("registerUsername").value.trim();

            const password =
                document.getElementById("registerPassword").value;

            message.className = "message";
            message.textContent = "";

            registerButton.disabled = true;
            registerButton.textContent = "Creating account...";

            try {

                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fullName,
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Account registration failed."
                    );
                }

                registerForm.reset();

                registerSection.style.display = "none";
                loginSection.style.display = "block";

                document.getElementById("username").value = username;

                message.textContent =
                    "Lecturer account created successfully. You can now sign in.";

                message.className = "message success";

            } catch (error) {

                message.textContent = error.message;
                message.className = "message error";

            } finally {

                registerButton.disabled = false;
                registerButton.innerHTML =
                    'Create Account <i class="fas fa-arrow-right"></i>';

            }

        });

    </script>

</body>
</html>
